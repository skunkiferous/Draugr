name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        # bin/* have no extension, so they are listed explicitly.
        run: shellcheck --external-sources --shell=bash lib/common.sh install.sh tests/mocks/sbx bin/*

      - name: Comment density
        # Draugr's premise is that you can read a file before you trust it, so
        # an uncommented block is a defect like any other. See docs/HACKING.md.
        run: ./tests/lint-comments.sh lib/common.sh install.sh bin/* tests/mocks/sbx tests/helper.bash tests/lint-comments.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Configure git for the fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      - name: Provide a writable /mnt/c
        # The mound commands refuse any repo outside /mnt/<drive>, because sbx
        # cannot mount one. That check is pure string matching, so a plain
        # directory satisfies it and the tests stay real on a Linux runner.
        # Without this every mound test would skip and the job would pass empty.
        run: sudo mkdir -p /mnt/c/Temp && sudo chmod 1777 /mnt/c/Temp

      - name: Run tests
        # One run, kept in a file, so the skip check below costs nothing extra.
        # set -o pipefail keeps bats's exit status from being masked by tee.
        run: |
          set -o pipefail
          bats tests/ | tee bats.log

      - name: Fail if any test skipped
        # A skip is invisible in a green tick: if /mnt/c ever stops being
        # writable, every mound test turns into a no-op and the job still passes.
        # This turns "tested nothing" into a failure.
        run: |
          if grep -q '# skip' bats.log; then
            grep '# skip' bats.log
            echo "::error::tests skipped - see docs/HACKING.md, 'Pattern: mocking sbx'"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every dr-* named in the README exists in bin/
        # Advisory until Phase 7: the README is the specification and documents
        # commands that are not written yet, each marked with an hourglass. When
        # the last one is gone this drops the "exit 0" and becomes blocking.
        run: |
          missing=0
          for cmd in $(grep -oE '\bdr-[a-z]+' README.md | sort -u); do
            if [ ! -f "bin/$cmd" ]; then
              echo "not implemented yet: $cmd"
              missing=$((missing + 1))
            fi
          done
          echo "$missing README command(s) still unimplemented."
          exit 0
