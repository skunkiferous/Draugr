name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        # bin/* and tests/mocks/* have no extension, so they are globbed rather
        # than named - a new mock is then linted without anyone remembering to
        # add it here.
        run: shellcheck --external-sources --shell=bash lib/common.sh lib/agents/*.sh install.sh tests/mocks/* bin/*

      - name: Comment density
        # Draugr's premise is that you can read a file before you trust it, so
        # an uncommented block is a defect like any other. See docs/HACKING.md.
        #
        # No arguments on purpose: the file list lives in the script, so that
        # running it locally checks exactly what CI checks. It used to be spelled
        # out here, and the bare local invocation silently checked nothing.
        run: ./tests/lint-comments.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Configure git for the fixtures
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      - name: Provide a writable /mnt/c
        # The mound commands refuse any repo outside /mnt/<drive>, because sbx
        # cannot mount one. That check is pure string matching, so a plain
        # directory satisfies it and the tests stay real on a Linux runner.
        # Without this every mound test would skip and the job would pass empty.
        run: sudo mkdir -p /mnt/c/Temp && sudo chmod 1777 /mnt/c/Temp

      - name: Run tests
        # One run, kept in a file, so the skip check below costs nothing extra.
        # set -o pipefail keeps bats's exit status from being masked by tee.
        run: |
          set -o pipefail
          bats -j 8 tests/ | tee bats.log

      - name: Fail if any test skipped
        # A skip is invisible in a green tick: if /mnt/c ever stops being
        # writable, every mound test turns into a no-op and the job still passes.
        # This turns "tested nothing" into a failure.
        run: |
          if grep -q '# skip' bats.log; then
            grep '# skip' bats.log
            echo "::error::tests skipped - see docs/HACKING.md, 'Pattern: mocking sbx'"
            exit 1
          fi

  # The documentation checks live in tests/docs.bats and run with everything
  # else. They were a separate advisory job while the README specified commands
  # that were not written yet; the last one shipped in 0.1.0, so they are now
  # ordinary blocking tests and need no job of their own.
