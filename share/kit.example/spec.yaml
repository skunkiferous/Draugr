# .draugr/kit/spec.yaml: what this project needs IN the mound. Commit it.
#
# This is a standard sbx kit, not a Draugr invention. It works with plain
#   sbx run claude --kit .draugr/kit
# To share it with other repositories, pack it and push it to a registry:
#   sbx kit pack .draugr/kit && sbx kit push ...
#
# Full schema: https://docs.docker.com/ai/sandboxes/customize/kits/
# Worked examples: https://github.com/docker/sbx-kits-contrib
#
# Make sure that it is correct before a failure tells you:  dr-kit validate
# See the rules that really apply, defaults included:  dr-policy
# A changed kit recreates the container. Thus dr-up reports the drift, and does
# not do it without your knowledge.

# v2 spellings in all places. v1 still validates, but each field below moved,
# and v1 now gives a deprecation warning at each check. A warning that you
# learn to ignore is worse than no warning. Tested with sbx 0.37.1.
schemaVersion: "2"
kind: mixin
# `name` is the one field with rules. sbx requires lowercase alphanumeric with
# hyphens, so it is a slug of the project name, not the name itself.
# displayName and description below are free text, and keep the original spelling.
name: @SLUG@
displayName: @NAME@ development environment
description: Network rules and setup for the @NAME@ project.

# No `requires: agent:` here, on purpose. It is optional. A kit that names an
# agent CANNOT be composed with another kit. sbx refuses it. Thus a change of
# DRAUGR_AGENT then needs an edit of this file. Almost nothing below is specific
# to an agent. Network rules, install commands, and ports belong to the project.
# If you need one kit for each agent, put it in a directory with the name of the
# agent at the end: .draugr/kit.codex/. If that agent is configured, Draugr
# prefers it to this one.

caps:
  network:
    # ADDED TO the machine-wide defaults. It does not replace them. sbx ships a
    # local policy of ~190 allow rules for package managers, OS packages, the
    # usual code hosts, and the AI service endpoints. Thus npm, pip, and
    # github.com already work with nothing listed here.
    #
    # Default-deny still applies. sbx refuses each host that matches no rule.
    # To test a specific host:  dr-policy --check <host>
    allow: []
      # - internal-registry.example.com
      # - files.example.org

    # deny wins over allow. Use it to cut a hole in a wildcard, or to close
    # something that the machine-wide defaults allow.
    #deny:
    #  - telemetry.example.com

# Ports this project always serves. Top-level in v2, NOT under network:.
# For a temporary port, use dr-ports. An edit of the kit recreates the container.
#publishedPorts:
#  - container: 5173
#    protocol: tcp
#    name: dev-server

# Each variable REPLACES the value of the image, and does not extend it. That
# makes PATH dangerous here. An absolute PATH that looks standard drops all that
# the image added, also the directory of the agent binary. The next dr-go then
# ends in "command not found" before the agent starts. If a program needs a
# specific interpreter, name it in the program (.venv/bin/python3). Do not use
# PATH here.
#environment:
#  variables:
#    NODE_ENV: development

commands:
  # Runs once, when the sandbox is created, and BEFORE your repository is in
  # the workspace. At that moment, the working directory is EMPTY, and the repo
  # is read-only at /run/sandbox/source. Thus a command that reads a project
  # file fails, also if it looks correct. Tests on sbx 0.37.1 showed this, in
  # clone mode and in mount mode. Here, `uv pip install -r requirements.txt`
  # gives only `error: File not found`.
  #
  # apt-get install can stay here with no change. A command that reads the
  # project must name the read-only copy. It must put its result in a place
  # that the agent session does not overwrite later. The workspace is not
  # that place.
  #
  # A failure here reaches sbx as a bare `500 ... failed to run sandbox
  # container`. dr-up prints the real record of sandboxd below it.
  install: []
    # - command: "uv venv /home/agent/.venv"
    #   user: "1000"
    #   description: Create the virtual environment
    # - command: "uv pip install --python /home/agent/.venv/bin/python -r /run/sandbox/source/requirements.txt"
    #   user: "1000"
    #   description: Install dependencies, from the read-only copy of the repo

  # Runs at each start, so it must be idempotent (safe to run twice). Here,
  # `command` must be a LIST. Unlike install, startup refuses a plain string.
  #startup:
  #  - command: ["sh", "-c", "nohup npm run dev >/tmp/dev.log 2>&1 &"]
  #    user: "1000"
  #    background: true
  #    description: Start the dev server
