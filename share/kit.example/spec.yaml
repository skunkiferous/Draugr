# .draugr/kit/spec.yaml - what this project needs INSIDE the mound. Commit it.
#
# This is a standard sbx kit, not a Draugr invention. It works with plain
#   sbx run claude --kit .draugr/kit
# and can be packed and pushed to a registry to share across repositories:
#   sbx kit pack .draugr/kit && sbx kit push ...
#
# Full schema: https://docs.docker.com/ai/sandboxes/customize/kits/
# Worked examples: https://github.com/docker/sbx-kits-contrib
#
# Check it before you find out the hard way:  dr-kit validate
# See what is actually in force, defaults included:  dr-policy
# Applying a changed kit recreates the container, so dr-up reports drift rather
# than doing it behind your back.

# v2 spellings throughout. v1 still validates, but every field below has moved
# and v1 now emits a deprecation warning on each check - and a warning you are
# trained to ignore is worse than no warning. Verified against sbx 0.37.1.
schemaVersion: "2"
kind: mixin
# `name` is the one constrained field: sbx requires lowercase alphanumeric with
# hyphens, so it is a slug of the project name rather than the name itself.
# displayName and description below are free text and keep the original spelling.
name: @SLUG@
displayName: @NAME@ development environment
description: Network rules and setup for the @NAME@ project.

# No `requires: agent:` here, and that is deliberate. It is optional, and a kit
# that names an agent CANNOT be composed with any other - sbx refuses outright,
# so switching DRAUGR_AGENT would mean editing this file. Almost nothing below
# is agent-specific: network rules, install commands and ports are properties of
# the project. If you do need one kit per agent, put it in a directory with the
# agent's name appended - .draugr/kit.codex/ - which Draugr prefers over this one
# when that agent is configured.

caps:
  network:
    # ADDED TO the machine-wide defaults, not instead of them. sbx ships a local
    # policy of ~190 allow rules covering package managers, OS packages, the
    # common code hosts and the AI service endpoints - so npm, pip and github.com
    # already work without listing anything here.
    #
    # Default-deny is still real: anything matching no rule anywhere is refused.
    # Check a specific host with:  dr-policy --check <host>
    allow: []
      # - internal-registry.example.com
      # - files.example.org

    # deny wins over allow, which is how you carve a hole in a wildcard or shut
    # off something the machine-wide defaults let through.
    #deny:
    #  - telemetry.example.com

# Ports this project always serves. Top-level in v2, NOT under network:.
# For one-off ports use dr-ports instead - editing the kit recreates the container.
#publishedPorts:
#  - container: 5173
#    protocol: tcp
#    name: dev-server

#environment:
#  variables:
#    NODE_ENV: development

commands:
  # Runs once, when the sandbox is created - and BEFORE your repository is in
  # the workspace. At that moment the working directory is EMPTY and the repo is
  # read-only at /run/sandbox/source, so a command that reads a project file
  # fails however right it looks. Measured against sbx 0.37.1 in both clone and
  # mount mode; `uv pip install -r requirements.txt` here gives you nothing but
  # `error: File not found`.
  #
  # apt-get install belongs here unchanged. Anything that reads the project has
  # to name the read-only copy, and put its result somewhere the agent session
  # will not later overwrite - the workspace is not that place.
  #
  # A failure here reaches sbx as a bare `500 ... failed to run sandbox
  # container`. dr-up prints what sandboxd actually recorded underneath it.
  install: []
    # - command: "uv venv /home/agent/.venv"
    #   user: "1000"
    #   description: Create the virtual environment
    # - command: "uv pip install --python /home/agent/.venv/bin/python -r /run/sandbox/source/requirements.txt"
    #   user: "1000"
    #   description: Install dependencies, from the read-only copy of the repo

  # Runs on every start, so it must be idempotent. Note that `command` must be a
  # LIST here - unlike install, startup rejects a plain string.
  #startup:
  #  - command: ["sh", "-c", "nohup npm run dev >/tmp/dev.log 2>&1 &"]
  #    user: "1000"
  #    background: true
  #    description: Start the dev server
