# .draugr/kit/spec.yaml - what this project needs INSIDE the mound. Commit it.
#
# This is a standard sbx kit, not a Draugr invention. It works with plain
#   sbx run claude --kit .draugr/kit
# and can be packed and pushed to a registry to share across repositories:
#   sbx kit pack .draugr/kit && sbx kit push ...
#
# Full schema: https://docs.docker.com/ai/sandboxes/customize/kits/
# Worked examples: https://github.com/docker/sbx-kits-contrib
#
# Check it before you find out the hard way:  dr-kit validate
# Applying a changed kit recreates the container, so dr-up reports drift rather
# than doing it behind your back.

schemaVersion: "1"
kind: mixin
name: @NAME@
displayName: @NAME@ development environment
description: Network rules and setup for the @NAME@ project.

requires:
  agent: @AGENT@

network:
  # Deny-by-default: the agent reaches nothing that is not listed here. Add the
  # registries your build actually needs and no more - this list is the whole
  # reason for running the agent in a mound.
  allowedDomains: []
    # - registry.npmjs.org
    # - pypi.org
    # - files.pythonhosted.org
    # - github.com

  # deniedDomains wins over allowedDomains, for carving holes in a wildcard.
  #deniedDomains:
  #  - telemetry.example.com

  # Ports this project always serves. For one-off ports use dr-ports instead:
  # editing the kit recreates the container.
  #publishedPorts:
  #  - container: 5173
  #    protocol: tcp
  #    name: dev-server

#environment:
#  variables:
#    NODE_ENV: development

commands:
  # Runs once, when the sandbox is created. This is where npm ci, uv sync and
  # apt-get install go - the difference between a teammate cloning your repo and
  # being productive in one command, versus half an hour of guessing.
  install: []
    # - command: "npm ci"
    #   user: "1000"
    #   description: Install dependencies

  # Runs on every start, so it must be idempotent.
  #startup:
  #  - command: ["sh", "-c", "nohup npm run dev >/tmp/dev.log 2>&1 &"]
  #    user: "1000"
  #    background: true
  #    description: Start the dev server
