commands:
  install:
    - command: "apt-get update -qq"
      user: "0"
      description: Refresh package lists
    - command: "env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tinyproxy"
      user: "0"
      description: Install tinyproxy
    # Samba serves to the VM the directories that DRAUGR_MOUNTS gave this mound.
    # SMB, not sftp, because the guest needs no install for it. Also, it reports
    # a refused write correctly. A test showed that sshfs/WinFsp reported a
    # refused delete as a success. .draugr/hooks/post-up configures and starts
    # it, for the same reason as tinyproxy. Startup commands die at the next
    # restart of sandboxd.
    - command: "env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba"
      user: "0"
      description: Install the SMB server that shares the vault with the VM
  # NO commands.startup, on purpose. A test on sbx 0.37.1 showed that after a
  # restart of sandboxd, the startup commands of a sandbox never run again. Each
  # Windows reboot restarts it. Thus .draugr/hooks/post-up starts tinyproxy at
  # each dr-up.
