      - tuf-repo-cdn.sigstore.dev
      - yarnpkg.com
      - ziglang.org
      # default-code-and-containers: code hosts and container registries. GitHub and **.docker.com stay open, see above
      - "**.data.mcr.microsoft.com"
      - "**.docker.io"
      - "**.gcr.io"
      - "**.githubcopilot.com"
      - "**.gitlab.com"
      - "**.production.cloudflare.docker.com"
      - "**.production.cloudfront.docker.com"
      - bitbucket.org
      - dhi.io
      - docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
      - docker.com
      - docker.io
      - gcr.io
      - ghcr.io
      - gitlab.com
