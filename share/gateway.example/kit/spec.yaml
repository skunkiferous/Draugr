# syntax=docker/sandbox-kit:3
#
# Generated gateway file. `dr-forge gateway` writes it from
# share/gateway.example/ in the Draugr checkout, and a gateway tracks nothing in
# git, on purpose. Thus the copy in a gateway needs no saving: generate it
# again. An edit of that copy does survive, because dr-forge leaves a file that
# differs from its template and says so, but nothing backs it up. Thus a change
# worth keeping belongs in share/gateway.example/, here in Draugr.
#

    # ONE allow is here, and the rule that kept this list empty still applies. Each
    # EGRESS HOST (each host that the tools of the guest connect to) is in a mixin. The
    # Unreal hosts are in kits/unreal. The hosts that each Windows VM needs for its
    # toolchain and its Microsoft-account sign-in are in kits/base. With that split, a
    # forge VM for something other than Unreal drops one kit, and does not edit this one.
    #
    # localhost:18022 is not an egress host. It is the DATA PATH of the mound to the VM,
    # and it belongs to this gateway, not to a toolchain. The code and the data are in
    # the VM, so the normal git and data commands of Draugr must reach it. The only route
    # from WSL is through this mound. `dr-policy --allow` opens it on the running mound,
    # and then loses it ("machine state, not repo state", in its own words). Thus it is
    # here, where it goes with the project.
    #
    # WHY 18022 AND NOT THE RELAY PORT: the relay port moves (two tests showed this). A
    # rule with it becomes wrong in an hour. vm-tunnel.ps1 pins it with
    # -L 127.0.0.1:18022:127.0.0.1:22, and reads the moving one again at each reconnect.
    # Thus this rule never needs a change. docs/FORGE.md, "The channel".
    #
    # First, password authentication was turned off in the sshd of the guest (a test
    # showed that it now offers publickey only). That order is important. A mound that
    # can reach an sshd that accepts passwords can sit and guess one.
schemaVersion: "3"
kind: mixin
displayName: Draugr gateway
description: Allow-all forward proxy for the Unreal VM. The sbx policy is the allowlist.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # NO install: section. It does not help, and that was measured rather
      # than assumed: with `install: allow:` naming deb.debian.org and dhi.io,
      # the install commands still answered 403. The refusal was never about
      # the HOST. The machine-wide policy allows port 443 only, and the apt
      # sources of this image are http://, so the proxy refused the port. The
      # install commands at the end of this file ask for https instead, which
      # needs no allow of its own.
      runtime:
        allow:
          - localhost:18022
        #
        # The deny list narrows the machine-wide defaults of sbx (~190 allows, see
        # `dr-policy --defaults`) to what the tools of the VM used in the tests. Each
        # default that the VM never used is closed.
        # Generated from the sbx 0.37.1 defaults. After an sbx upgrade, read
        # `dr-policy --defaults` again for new rules.
        #
        # Left open on purpose:
        #   default-cert-validation, all of it: revocation checks (D6)
        #   archive.ubuntu.com, security.ubuntu.com: the own install of this gateway
        #   **.docker.com: the sbx base image lists download.docker.com as an apt source,
        #     so apt-get update fails without it (a test showed this). A push to Docker
        #     Hub goes to docker.io, which stays denied
        #   **.github.com, github.com, **.githubusercontent.com: kits/unreal needs them
        #     (the Unreal plugin of Visual Studio, and Unreal source builds), and deny wins
        #   **.visualstudio.com, visualstudio.com: the license check of kits/unreal is there
        #   login.microsoftonline.com: the Visual Studio sign-in keeps the Community license
        #   challenges.cloudflare.com, www.google.com, **.googleapis.com: seen in the tests
        #     (sign-in challenge, the editor, browser background), except storage. below
        #   **.astral.sh, pypi.org, files.pythonhosted.org: kits/base allows them, so that the
        #     guest can install uv, a Windows Python, and the UIA MCP server. Deny wins.
        #     Removed from the package-manager block below. All else there stays closed,
        #     so this is only Python.
        #   code.visualstudio.com, vscode.download.prss.microsoft.com: REMOVED from the deny
        #     list, and allowed in kits/base. Unreal Angelscript needs VS Code and its
        #     "Unreal Angelscript" extension. Deny wins over allow, so while these were
        #     here, `dr-policy --allow` was not able to open them.
        #   vscode.dev: REMOVED from the deny list. The reason for the deny was "that is the
        #     browser editor, which nothing needs". That reason was WRONG. It judged the host
        #     by its famous content, not by what the path does. vscode.dev/redirect is the
        #     OAuth redirect broker of DESKTOP VS Code. A GitHub OAuth app must register one
        #     fixed redirect URI. A random 127.0.0.1 port cannot be registered. Thus
        #     Microsoft registered vscode.dev/redirect, which sends the browser to the
        #     loopback URL in `state`. The deny broke GitHub sign-in in the guest AFTER the
        #     password and the 2FA code were both accepted. It showed as
        #     ERR_TUNNEL_CONNECTION_FAILED on a vscode.dev URL. That looks like a dead
        #     website, not like a rule that you wrote. Now allowed in kits/base.
        #   github.githubassets.com, **.gstatic.com: the asset hosts for the GitHub and Google
        #     sign-in pages, allowed in kits/base. A blocked asset host gives no error. The
        #     HTML arrives, but the CSS and JS do not. The page shows as plain text with no
        #     style, and its buttons do nothing. A TEST SHOWED exactly that on the GitHub
        #     login page. It looks like a broken or fake site.
        #   nothing above the Microsoft-account hosts of kits/base. TESTED: no line below
        #     matches "**.live.com", "**.msauth.net", "**.msftauth.net", or
        #     lgincdnmsftuswe2.azureedge.net. Keep it that way. A deny of an apex above one
        #     of them breaks each Microsoft sign-in in the guest. It shows as a *network*
        #     error from inside a Windows dialog, and that costs a day to diagnose.
        #
        # deny wins over allow, in all places. `dr-policy --allow` can NOT open a host
        # that is here. First delete its line. Then allow it in its mixin: kits/unreal for
        # an Unreal host, kits/base for a host that each Windows VM needs.
        # NEVER deny "**". It also blocks kits/unreal.
        deny:
          # THREE PACKAGE HOSTS ARE NOT DENIED HERE, and the only reason is that
          # this kit has to install tinyproxy and samba. Nothing else about this
          # gateway wants them reachable: each was denied with every other package
          # manager below, so that the VM behind this proxy could fetch no
          # tooling, and all three belong in that list. The entries that had to
          # go:
          #
          #     - "**.debian.org"        - debian.org        - dhi.io
          #
          # A deny beats an allow, and it carries no port, so a denied
          # `**.debian.org` also closes 443, which is the one port the machine-wide
          # policy allows. While Debian was denied, the install commands could
          # reach nothing and this gateway could not be built at all. On sbx 0.37.1
          # it worked with the deny in place, so that version did not apply a kit
          # deny to the install phase, and 0.53 does.
          #
          # dhi.io is the apt repository of the Docker Hardened Images, and the
          # base image of this mound IS one: its packages carry a `+dhiN` suffix
          # and are built there. Deleting its source file instead, to keep the
          # deny, was tried and was WRONG: apt then resolved everything against
          # plain Debian, REMOVED the hardened base of the image ("Removing
          # python-3.14 ..."), and the installs died anyway, tinyproxy in its
          # postinst and samba on libncurses6/libtinfo6 conflicts. An image built
          # from that repository needs it to resolve its own dependencies.
          #
          # The widening is as small as it can be:
          #   * All three are PACKAGE REPOSITORIES, reachable for the length of a
          #     create and for whatever the hook installs afterwards.
          #   * The guest is WINDOWS. A Windows VM has no use for a Debian or a
          #     Docker Hardened Images package.
          #   * Every other package manager below stays denied: npm, maven,
          #     rubygems, rustup, pypi and the rest. docker.io, ghcr.io and every
          #     other registry stay denied too: dhi.io serves apt packages, not
          #     images.
          #
          # PUT ALL THREE BACK if this kit ever stops installing packages. They
          # are removed for that reason alone.
          # default-ai-services: AI services. Nothing in the VM talks to a model. The agent does that from its own mound
          - "**.chatgpt.com"
          - "**.cursor.sh"
          - "**.factory.ai"
          - "**.oaistatic.com"
          - "**.oaiusercontent.com"
          - "**.openai.com"
          - api.anthropic.com
          - api.perplexity.ai
          - api.workos.com
          - cdn.openaimerge.com
          - chatgpt.com
          - claude.com
          - cursor.com
          - downloads.claude.ai
          - factory.ai
          - gemini.google.com
          - generativelanguage.googleapis.com
          - mcp-proxy.anthropic.com
          - models.dev
          - platform.claude.com
          - play.googleapis.com
          - statsig.anthropic.com
          # default-package-managers: language package managers. The Epic, Unreal, and Visual Studio tools use none
          - "**.bun.sh"
          - "**.gradle.org"
          - "**.packagist.org"
          - "**.yarnpkg.com"
          - apache.org
          - bootstrap.pypa.io
          - bun.sh
          - cocoapods.org
          - cpan.org
          - crates.io
          - dot.net
          - dotnet.microsoft.com
          - eclipse.org
          - golang.org
          - goproxy.io
          - gradle.org
          - haskell.org
          - hex.pm
          - index.crates.io
          - java.com
          - java.net
          - maven.org
          - metacpan.org
          - nodejs.org
          - nodesource.com
          - npm.duckdb.org
          - npmjs.com
          - npmjs.org
          - nuget.org
          - packagist.com
          - packagist.org
          - pkg.go.dev
          - proxy.golang.org
          - pub.dev
          - pypa.io
          - pypi.python.org
          - pythonhosted.org
          - registry.npmjs.org
          - repo.maven.apache.org
          - ruby-lang.org
          - rubygems.org
          - rubyonrails.org
          - rustup.rs
          - rvm.io
          - sh.rustup.rs
          - spring.io
          - static.crates.io
          - static.rust-lang.org
          - sum.golang.org
          - swift.org
          - tuf-repo-cdn.sigstore.dev
          - yarnpkg.com
          - ziglang.org
          # default-code-and-containers: code hosts and container registries. GitHub and **.docker.com stay open, see above
          - "**.data.mcr.microsoft.com"
          - "**.docker.io"
          - "**.gcr.io"
          - "**.githubcopilot.com"
          - "**.gitlab.com"
          - "**.production.cloudflare.docker.com"
          - "**.production.cloudfront.docker.com"
          - bitbucket.org
          # dhi.io WOULD BE HERE. It is not denied, because this kit installs
          # packages and the base image resolves its own against that repository.
          # The long note at the head of this deny list says why, and says to put
          # it back when the installs go.
          - docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
          - docker.com
          - docker.io
          - gcr.io
          - ghcr.io
          - gitlab.com
          - k8s.io
          - launchpad.net
          - mcr.microsoft.com
          - ppa.launchpad.net
          - production.cloudflare.docker.com
          - production.cloudfront.docker.com
          - public.ecr.aws
          - quay.io
          - registry.k8s.io
          - sourceforge.net
          # default-cloud-infrastructure: cloud services, and some accept uploads. The tools use none
          - "**.amazonaws.com"
          - "**.blob.core.windows.net"
          - "**.googleusercontent.com"
          - "**.gvt1.com"
          - "**.hashicorp.com"
          - "**.public.blob.vercel-storage.com"
          - apis.google.com
          - app.daytona.io
          - azure.com
          - binaries.prisma.sh
          - clerk.com
          - csp.withgoogle.com
          - dev.azure.com
          - dl.google.com
          - fastly.com
          - figma.com
          - hashicorp.com
          - jsdelivr.net
          - json-schema.org
          - json.schemastore.org
          - mise-versions.jdx.dev
          - mise.run
          - packages.microsoft.com
          - play.google.com
          - playwright.azureedge.net
          - storage.googleapis.com
          - supabase.com
          - unpkg.com
          - vercel.com
          # default-os-packages: Linux package archives. The gateway installs only from Ubuntu (kept open)
          - alpinelinux.org
          - apt.llvm.org
          - archlinux.org
          - centos.org
          - dl-cdn.alpinelinux.org
          - fedoraproject.org
          - packagecloud.io
          - ports.ubuntu.com
          - ubuntu.com
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # HTTPS FIRST, and that is not a preference. The apt sources of this
        # image are http://, and the network policy of this machine allows
        # `**.debian.org:443` and NOT port 80. The proxy answers a port-80 fetch
        # with 403, so `apt-get update` fails, every install after it fails, and
        # the create dies AFTER the old mound was removed. Measured on sbx 0.53.
        #
        # A claude mound does not need this, because the kit of that agent adds
        # `debian.org:80` to its own policy. The shell image has no such kit, so
        # the gateway has to ask for the port that the machine already allows.
        - command: "sed -i 's|http://|https://|g' /etc/apt/sources.list.d/debian.sources"
          user: "0"
          description: Use https for Debian, because only 443 is allowed
        # THE SAME CHANGE for the second source, and this one must not be
        # dropped. dhi.io is the apt repository of the Docker Hardened Images,
        # and the base image of this mound is one of them: `rsync` in here is
        # 3.5.0+ds1-0+deb13u1+dhi1, not the Debian build. Deleting the file was
        # tried, to keep dhi.io denied, and apt then resolved everything against
        # plain Debian and REMOVED the hardened base ("Removing python-3.14
        # ..."). Both installs below failed after that. So the source stays, over
        # https, and dhi.io is not denied. The note in the deny list above has
        # the whole story.
        - command: "sed -i 's|http://|https://|g' /etc/apt/sources.list.d/dhi.sources"
          user: "0"
          description: Use https for the hardened-image repository too
        - command: "apt-get update -qq"
          user: "0"
          description: Refresh package lists
        # BEFORE tinyproxy, and it is not optional. The postinst of tinyproxy
        # chowns its log directory to `tinyproxy:adm`, and this hardened image
        # ships NO adm group, so the install dies with
        # `chown: invalid group 'tinyproxy:adm'` and the create fails after the
        # old mound was already removed. -f, so that a re-run of this kit is
        # still fine.
        - command: "groupadd -f adm"
          user: "0"
          description: Create the adm group, which this hardened image lacks
        - command: "env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tinyproxy"
          user: "0"
          description: Install tinyproxy
        # Samba serves to the VM the directories that DRAUGR_MOUNTS gave this mound.
        # SMB, not sftp, because the guest needs no install for it. Also, it reports
        # a refused write correctly. A test showed that sshfs/WinFsp reported a
        # refused delete as a success. .draugr/hooks/post-up configures and starts
        # it, for the same reason as tinyproxy. Startup commands die at the next
        # restart of sandboxd.
        - command: "env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba"
          user: "0"
          description: Install the SMB server that shares the vault with the VM
      # NO commands.startup, on purpose. A test on sbx 0.37.1 showed that after a
      # restart of sandboxd, the startup commands of a sandbox never run again. Each
      # Windows reboot restarts it. Thus .draugr/hooks/post-up starts tinyproxy at
      # each dr-up.
