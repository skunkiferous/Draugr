schemaVersion: "2"
kind: mixin
name: gateway
displayName: Draugr gateway
description: Allow-all forward proxy for the Unreal VM. The sbx policy is the allowlist.

caps:
  network:
    # ONE allow is here, and the rule that kept this list empty still applies. Each
    # EGRESS HOST (each host that the tools of the guest connect to) is in a mixin. The
    # Unreal hosts are in kits/unreal. The hosts that each Windows VM needs for its
    # toolchain and its Microsoft-account sign-in are in kits/base. With that split, a
    # forge VM for something other than Unreal drops one kit, and does not edit this one.
    #
    # localhost:18022 is not an egress host. It is the DATA PATH of the mound to the VM,
    # and it belongs to this gateway, not to a toolchain. The code and the data are in
    # the VM, so the normal git and data commands of Draugr must reach it. The only route
    # from WSL is through this mound. `dr-policy --allow` opens it on the running mound,
    # and then loses it ("machine state, not repo state", in its own words). Thus it is
    # here, where it goes with the project.
    #
    # WHY 18022 AND NOT THE RELAY PORT: the relay port moves (two tests showed this). A
    # rule with it becomes wrong in an hour. vm-tunnel.ps1 pins it with
    # -L 127.0.0.1:18022:127.0.0.1:22, and reads the moving one again at each reconnect.
    # Thus this rule never needs a change. docs/FORGE.md, "The channel".
    #
    # First, password authentication was turned off in the sshd of the guest (a test
    # showed that it now offers publickey only). That order is important. A mound that
    # can reach an sshd that accepts passwords can sit and guess one.
    allow:
      - localhost:18022
    #
    # The deny list narrows the machine-wide defaults of sbx (~190 allows, see
    # `dr-policy --defaults`) to what the tools of the VM used in the tests. Each
    # default that the VM never used is closed.
    # Generated from the sbx 0.37.1 defaults. After an sbx upgrade, read
    # `dr-policy --defaults` again for new rules.
    #
    # Left open on purpose:
    #   default-cert-validation, all of it: revocation checks (D6)
    #   archive.ubuntu.com, security.ubuntu.com: the own install of this gateway
    #   **.docker.com: the sbx base image lists download.docker.com as an apt source,
    #     so apt-get update fails without it (a test showed this). A push to Docker
    #     Hub goes to docker.io, which stays denied
    #   **.github.com, github.com, **.githubusercontent.com: kits/unreal needs them
    #     (the Unreal plugin of Visual Studio, and Unreal source builds), and deny wins
    #   **.visualstudio.com, visualstudio.com: the license check of kits/unreal is there
    #   login.microsoftonline.com: the Visual Studio sign-in keeps the Community license
    #   challenges.cloudflare.com, www.google.com, **.googleapis.com: seen in the tests
    #     (sign-in challenge, the editor, browser background), except storage. below
    #   **.astral.sh, pypi.org, files.pythonhosted.org: kits/base allows them, so that the
    #     guest can install uv, a Windows Python, and the UIA MCP server. Deny wins.
    #     Removed from the package-manager block below. All else there stays closed,
    #     so this is only Python.
    #   code.visualstudio.com, vscode.download.prss.microsoft.com: REMOVED from the deny
    #     list, and allowed in kits/base. Unreal Angelscript needs VS Code and its
    #     "Unreal Angelscript" extension. Deny wins over allow, so while these were
    #     here, `dr-policy --allow` was not able to open them.
    #   vscode.dev: REMOVED from the deny list. The reason for the deny was "that is the
    #     browser editor, which nothing needs". That reason was WRONG. It judged the host
    #     by its famous content, not by what the path does. vscode.dev/redirect is the
    #     OAuth redirect broker of DESKTOP VS Code. A GitHub OAuth app must register one
    #     fixed redirect URI. A random 127.0.0.1 port cannot be registered. Thus
    #     Microsoft registered vscode.dev/redirect, which sends the browser to the
    #     loopback URL in `state`. The deny broke GitHub sign-in in the guest AFTER the
    #     password and the 2FA code were both accepted. It showed as
    #     ERR_TUNNEL_CONNECTION_FAILED on a vscode.dev URL. That looks like a dead
    #     website, not like a rule that you wrote. Now allowed in kits/base.
    #   github.githubassets.com, **.gstatic.com: the asset hosts for the GitHub and Google
    #     sign-in pages, allowed in kits/base. A blocked asset host gives no error. The
    #     HTML arrives, but the CSS and JS do not. The page shows as plain text with no
    #     style, and its buttons do nothing. A TEST SHOWED exactly that on the GitHub
    #     login page. It looks like a broken or fake site.
    #   nothing above the Microsoft-account hosts of kits/base. TESTED: no line below
    #     matches "**.live.com", "**.msauth.net", "**.msftauth.net", or
    #     lgincdnmsftuswe2.azureedge.net. Keep it that way. A deny of an apex above one
    #     of them breaks each Microsoft sign-in in the guest. It shows as a *network*
    #     error from inside a Windows dialog, and that costs a day to diagnose.
    #
    # deny wins over allow, in all places. `dr-policy --allow` can NOT open a host
    # that is here. First delete its line. Then allow it in its mixin: kits/unreal for
    # an Unreal host, kits/base for a host that each Windows VM needs.
    # NEVER deny "**". It also blocks kits/unreal.
    deny:
      # default-ai-services: AI services. Nothing in the VM talks to a model. The agent does that from its own mound
      - "**.chatgpt.com"
      - "**.cursor.sh"
      - "**.factory.ai"
      - "**.oaistatic.com"
      - "**.oaiusercontent.com"
      - "**.openai.com"
      - api.anthropic.com
      - api.perplexity.ai
      - api.workos.com
      - cdn.openaimerge.com
      - chatgpt.com
      - claude.com
      - cursor.com
      - downloads.claude.ai
      - factory.ai
      - gemini.google.com
      - generativelanguage.googleapis.com
      - mcp-proxy.anthropic.com
      - models.dev
      - platform.claude.com
      - play.googleapis.com
      - statsig.anthropic.com
      # default-package-managers: language package managers. The Epic, Unreal, and Visual Studio tools use none
      - "**.bun.sh"
      - "**.gradle.org"
      - "**.packagist.org"
      - "**.yarnpkg.com"
      - apache.org
      - bootstrap.pypa.io
      - bun.sh
      - cocoapods.org
      - cpan.org
      - crates.io
      - dot.net
      - dotnet.microsoft.com
      - eclipse.org
