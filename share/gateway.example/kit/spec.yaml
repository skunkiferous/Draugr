      - hashicorp.com
      - jsdelivr.net
      - json-schema.org
      - json.schemastore.org
      - mise-versions.jdx.dev
      - mise.run
      - packages.microsoft.com
      - play.google.com
      - playwright.azureedge.net
      - storage.googleapis.com
      - supabase.com
      - unpkg.com
      - vercel.com
      # default-os-packages - Linux package archives: the gateway installs from Ubuntu only (kept)
      - "**.debian.org"
      - alpinelinux.org
      - apt.llvm.org
      - archlinux.org
      - centos.org
      - debian.org
      - dl-cdn.alpinelinux.org
      - fedoraproject.org
      - packagecloud.io
      - ports.ubuntu.com
      - ubuntu.com

commands:
  install:
    - command: "apt-get update -qq"
      user: "0"
      description: Refresh package lists
    - command: "env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tinyproxy"
      user: "0"
      description: Install tinyproxy
    # Samba serves the VM the directories DRAUGR_MOUNTS gave this mound. SMB
    # rather than sftp because the guest needs nothing installed for it, and
    # because it reports a refused write honestly - measured, where
    # sshfs/WinFsp instead reported a refused delete as a success.
    # Configured and started by .draugr/hooks/post-up, for the same reason
    # tinyproxy is - startup commands die with the next sandboxd restart.
    - command: "env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba"
      user: "0"
      description: Install the SMB server that shares the vault with the VM
  # Deliberately NO commands.startup. Measured on sbx 0.37.1: a sandbox's startup
  # commands stop running for good after sandboxd restarts, which every Windows
  # reboot does. .draugr/hooks/post-up starts tinyproxy on every dr-up instead.
