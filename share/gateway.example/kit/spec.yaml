      - vercel.com
      # default-os-packages: Linux package archives. The gateway installs only from Ubuntu (kept open)
      - "**.debian.org"
      - alpinelinux.org
      - apt.llvm.org
      - archlinux.org
      - centos.org
      - debian.org
