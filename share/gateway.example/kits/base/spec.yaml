schemaVersion: "2"
kind: mixin
name: base
displayName: Base VM tooling
description: Hosts any forge VM needs for its own toolchain, whatever it is built for.

# This kit is NOT about Unreal, on purpose. It holds what a Windows VM needs to build
# its own working environment. Thus the same list serves a VM for a very different
# purpose. The Unreal hosts stay in kits/unreal.
#
# The main rule is one that the autonomy of an agent depends on. A package manager
# goes here only if it can be pinned to a FIXED set of hosts. Then one allow lets the
# agent install all that it needs without another question. Each host outside that
# set still shows as a refusal that a person sees.
#
# What else belongs here: all that WINDOWS ITSELF needs to be a usable VM, not what a
# specific workload needs. Microsoft-account sign-in is the clear case. It is the own
# identity stack of the operating system. A VM without it cannot use the Store, and
# cannot sign in to a Windows-integrated tool.

caps:
  network:
    allow:
      # MSYS2: the Unix layer for a Windows guest. git, rsync, openssh, perl,
      # python, make, as native Windows binaries that use Windows paths.
      #
      # A TEST SHOWED why this is one line, not twenty. MSYS2 ships a rotating
      # mirrorlist of about 21 third-party mirrors (download.nus.edu.sg,
      # repo.extreme-ix.org, university mirrors). Pin each
      # /etc/pacman.d/mirrorlist.* to its repo.msys2.org line, and pacman
      # connects only to this host. The refusals named only this name. With it
      # allowed, `pacman -S git rsync openssh perl` installed all four through
      # the gateway.
      #
      # An MSYS2 with no pin reaches hosts that this list never named. Thus the
      # pin is part of the guest setup, not an optimization.
      - repo.msys2.org

      # Python, for the UIA MCP server. With it, an agent reads the controls of a
      # window, and does not guess from pixels. It is a Python program, so the guest
      # needs a Python, and the base image has none.
      #
      # These four are the full set, and they obey the rule above. PyPI ships no
      # rotating mirrorlist, so pip and uv always connect to exactly these names.
      # A TEST SHOWED that astral.sh/uv/install.ps1 is a 301 to releases.astral.sh.
      # Thus the exact name is not enough. The installer dies with no bytes read.
      - "**.astral.sh"         # the uv installer script, and the updates of uv
      - pypi.org               # the package index
      - files.pythonhosted.org # the wheels. Each download comes here
      # uv gets the interpreter from GitHub releases
      # (astral-sh/python-build-standalone), not from python.org. Both names are
      # already in the machine-wide defaults of sbx. They are also here, so that this
      # kit states what it needs, and does not depend on a default that can change.
      - github.com
      - objects.githubusercontent.com

      # AutoHotkey v2, to replay a path through a window that has no UIA tree (Slate,
      # CEF). A person or a vision pass finds the coordinates once. Then the replay
      # needs no model. The own domain of the vendor, so "**".
      - "**.autohotkey.com"

      # Visual Studio Code, and only the two hosts that install it. Not specific to
      # Unreal. Each Windows VM wants this editor, and Unreal Angelscript also needs it.
      # The documentation of that fork names VS Code and its "Unreal Angelscript"
      # extension for auto-completion and debugging.
      #
      # Both are already in the machine-wide defaults of sbx, so alone, this changes
      # nothing. The important step was to DELETE them from the deny list of
      # .draugr/kit. Deny wins over allow, and no `dr-policy --allow` can pass it. They
      # are also here, by the same rule as github.com above. This kit states what it
      # needs, and does not depend on a default that can change.
      #
      # vscode.dev IS here. The old comment here said the opposite: "the browser
      # editor, which nothing needs". That was wrong, and it cost an evening.
      # vscode.dev/redirect is the OAuth redirect broker of DESKTOP VS Code. GitHub
      # makes an OAuth app register one fixed redirect URI. "http://127.0.0.1" on a
      # port chosen for each attempt cannot be registered. Thus Microsoft registered
      # https://vscode.dev/redirect, and that page sends the browser to the loopback
      # URL in `state`. Thus sign-in fails AFTER the password and the 2FA code are
      # accepted. That is the worst place for a wall.
      #
      # The extension comes from marketplace.visualstudio.com, which the allowed
      # "**.visualstudio.com" covers. Its CDN is a *.vsassets.io name that no deny rule
      # touches. Thus a refusal there shows in `dr-policy --denied`, and does not fail
      # silently.
      - code.visualstudio.com               # the installer download page and its redirect
      - vscode.download.prss.microsoft.com  # the CDN that redirect lands on
      - vscode.dev                          # /redirect: the OAuth bounce back to 127.0.0.1
      - github.githubassets.com             # each stylesheet and script on github.com
      # The extension CDN. The note above said that it can show in `dr-policy --denied`,
      # and it did. Somebody opened it by hand on the running mound. That was only
      # machine state, so `dr-up --recreate` refused, and did not discard it. Now it is
      # here, in the mixin for each egress host. It is not in .draugr/kit, which only
      # narrows.
      - "**.vsassets.io"                    # the asset CDN of marketplace.visualstudio.com

      # Microsoft account sign-in, for the WINDOWS IDENTITY STACK itself, not for one
      # application. The account broker of Windows serves each "sign in with a Microsoft
      # account" dialog in the guest, not the embedded browser of the application: the
      # Store, each Windows-integrated sign-in, and the account UI of Visual Studio 2022.
      # A VM that cannot do this cannot install from the Store, and cannot sign in to a
      # Windows-integrated tool. The failure looks like a network fault. docs/FORGE.md of
      # Draugr has the phase for this.
      #
      # These hosts are NECESSARY BUT NOT ENOUGH. The guest must also see itself as
      # online, and the AppContainer of the broker must be able to reach the proxy. Those
      # are six separate faults, and guest/install-windows-online.ps1 fixes them. Without
      # that, these names do nothing. The failure names no host, so the log of the gateway
      # stays silent. A TEST SHOWED THIS.
      - "**.live.com"      # the sign-in flow itself. Covers login.live.com
      - "**.msauth.net"    # the auth CDN. Covers aadcdn.msauth.net
      - "**.msftauth.net"  # the same CDN under its second name. Covers aadcdn.msftauth.net
      - lgincdnmsftuswe2.azureedge.net  # the assets of the sign-in page. A shared CDN, so exact
      # The next three were opened during the search for that failure. They stay as they
      # were, but no test showed that ONE of them is necessary. install-windows-online.ps1
      # fixed sign-in, not these. A test showed that management.core.windows.net alone
      # changes nothing. Remove them only after a test on a new guest, not on a guess. The
      # removal of a host that is necessary costs an evening.
      - graph.microsoft.com
      - management.azure.com
      - management.core.windows.net
      #
      # login.microsoftonline.com is NOT here, on purpose. It is already one of the
      # machine-wide defaults of sbx, and .draugr/kit leaves it open, and does not deny it.

      # Sign in with a GOOGLE account. GitHub now offers it, beside passkeys and Apple.
      # Here, not in kits/unreal, on purpose. An identity provider is general
      # infrastructure, like the Microsoft block above. It is not about Unreal.
      #
      # **.gstatic.com is the static asset CDN of Google. It is taken WHOLE, not by
      # subdomain. That makes the allow wider, on purpose, for the same reason as
      # "**.msauth.net" above. The sign-in page gets css, fonts, and images from some
      # gstatic names. A missing one gives a page with no style, dead buttons, and NO
      # error. To find them by trial costs an evening. It serves static files, not an
      # API. First, it had to be DELETED from the deny list of .draugr/kit, because deny
      # wins over allow.
      #
      # apis.google.com is NOT here, on purpose, and stays denied. It is the JS API host
      # for the Identity Services widget of Google. A plain server-side OAuth redirect
      # must never reach it. If sign-in fails anyway, `dr-policy --denied` names it. That
      # is a test result, and this file prefers those to guesses.
      #
      # KNOW THIS BEFORE YOU TRUST IT: it moves the second factor, but does not remove
      # it. If a phone prompt or a passkey protects the Google account, the guest hits
      # the same wall one provider later. A TOTP code works across machines, because it
      # is six digits that you can read from each screen.
      - accounts.google.com  # the sign-in page and the OAuth endpoints
      - "**.gstatic.com"     # its css, fonts, and images. See the note above

# winget is absent, on purpose. A test showed that its source-backed commands fail
# in an ssh session (session 0) with 0x8a15000f "Data required by the source is
# missing". That happens also when its CDN answers (HTTP 200), and `winget source
# update` succeeds. An agent over ssh cannot use it, so an allow of its hosts gives
# nothing. Windows applications get installed with a download of the installer and
# a silent run. That needs only the own host of the vendor.
